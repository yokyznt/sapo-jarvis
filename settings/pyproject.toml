[project]
name = "sapo-preferencias"
description = "Preferencias del Sapo: ajustes de Sapo-Jarvis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=6.2.1",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
