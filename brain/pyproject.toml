[project]
name = "sapo-brain"
version = "0.1.0"
description = "Cerebro local de Sapo-Jarvis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=11",
    "psutil>=6",
    "pycaw>=20240316; sys_platform == 'win32'",
    "send2trash>=1.8",
    "sherpa-onnx>=2.0.0",
    "sounddevice>=0.5.6",
    "websockets>=17.3",
]

[project.scripts]
sapo-brain = "sapo.server:main"
sapo-chat = "sapo.chat:main"
sapo-voice = "sapo.voice.client:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sapo"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
