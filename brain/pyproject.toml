[project]
name = "sapo-brain"
version = "0.1.0"
description = "Cerebro local de Sapo-Jarvis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "websockets>=17.3",
]

[project.scripts]
sapo-brain = "sapo.server:main"
sapo-chat = "sapo.chat:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sapo"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
